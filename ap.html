<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Thương tính tiền</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; font-size: 13px; background-color: #0a0a0a; color: #cbd5e1; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .uniform-size {
            width: 100%;
            max-width: 320px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        input[type="date"] {
            color-scheme: dark;
        }
    </style>
</head>
<body>

    <div id="app" class="min-h-screen flex flex-col">
        <!-- Navigation -->
        <nav class="sticky top-0 z-50 bg-black/60 backdrop-blur-xl border-b border-white/5 px-4 py-3 flex justify-between items-center no-print">
            <div class="flex items-center gap-2 cursor-pointer" onclick="router.go('selection')">
                <div class="bg-blue-600 p-1 rounded-md shadow-lg shadow-blue-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <span class="font-black uppercase tracking-tight text-sm text-white">Công Thương tính tiền</span>
            </div>
            <div class="flex gap-2">
                <button id="themeBtn"
        class="p-2 rounded-lg bg-white/5 text-slate-400 border border-white/10 transition-all hover:text-white"
        onclick="toggleTheme()">
        ☀️
    </button>
                <button id="exitBtn" class="hidden px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-[10px] uppercase font-black transition-all text-white border border-white/10" onclick="router.go('selection')">Thoát</button>
                <button id="adminBtn" class="p-2 rounded-lg bg-white/5 text-slate-400 border border-white/10 transition-all hover:text-white" onclick="router.toggleAdmin()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="main-content" class="max-w-[1600px] mx-auto w-full p-4 md:p-6 flex-1 flex flex-col items-center justify-center">
            <div id="loading-spinner" class="flex flex-col items-center gap-4">
                <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="font-black uppercase text-[10px] tracking-widest opacity-50">Đang khởi tạo kết nối Realtime...</p>
            </div>
        </main>

        <!-- Notification -->
        <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-6 py-2.5 rounded-full shadow-2xl flex items-center gap-2 border bg-blue-600/90 border-blue-400 hidden animate-fade-in">
            <span id="toast-text" class="font-black text-[11px] text-white uppercase tracking-tight">Thông báo</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, update } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // --- CẤU HÌNH FIREBASE REALTIME DB ---
        const firebaseConfig = {
            apiKey: "AIzaSyCF16Ze3NczHi3B3NU2-y4QJzdx35dKpsY",
            authDomain: "chamcong-1cbc1.firebaseapp.com",
            databaseURL: "https://chamcong-1cbc1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chamcong-1cbc1",
            storageBucket: "chamcong-1cbc1.firebasestorage.app",
            messagingSenderId: "1037808997570",
            appId: "1:1037808997570:web:0c3bd96af91a30edc9975b",
            measurementId: "G-LR48BVDHY3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const rtdb = getDatabase(app);
        const staffList = ['Đô', 'Em', 'Hưng', 'Khang'];

        let state = {
            user: null,
            view: 'selection',
            selectedStaff: null,
            isAdminAuthenticated: false,
            records: [],
            adminFilterStaff: staffList[0],
            currentMonth: new Date().getMonth(),
            currentYear: new Date().getFullYear(),
            checkInDate: new Date().toISOString().split('T')[0]
        };

        const todayStr = new Date().toISOString().split('T')[0];

        function getLunarDate(date) {
            const d = new Date(date);
            const jd = Math.floor(d.getTime() / 86400000) + 2440588;
            const l0 = (jd - 2451550.1) / 29.530588853;
            const phase = (l0 - Math.floor(l0)) * 29.53;
            let lunarDay = Math.floor(phase) + 2; 
            if (lunarDay > 30) lunarDay = 1;
            let lunarMonth = d.getMonth() + 1;
            if (d.getDate() < lunarDay - 2) lunarMonth = d.getMonth();
            if (lunarMonth <= 0) lunarMonth = 12;
            return `${lunarDay}/${lunarMonth} (Âm)`;
        }

        const showToast = (text, isError = false) => {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toast.className = `fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-6 py-2.5 rounded-full shadow-2xl flex items-center gap-2 border ${isError ? 'bg-red-500/90 border-red-400' : 'bg-blue-600/90 border-blue-400'} animate-fade-in`;
            toastText.innerText = text;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        };

        window.router = {
            go: (view, staff = null) => {
                state.view = view;
                state.selectedStaff = staff;
                if (view === 'selection') {
                    state.isAdminAuthenticated = false;
                    document.getElementById('exitBtn').classList.add('hidden');
                } else {
                    document.getElementById('exitBtn').classList.remove('hidden');
                }
                render();
            },
            toggleAdmin: () => {
                state.view = 'admin';
                render();
            }
        };

        window.handleCheckIn = async () => {
            if (!state.user) {
                showToast("Đang kết nối Realtime DB...", true);
                return;
            }
            if (state.checkInDate > todayStr) {
                showToast("Không thể chấm công ngày tương lai!", true);
                return;
            }

            const dateObj = new Date(state.checkInDate);
            const dateStr = dateObj.toLocaleDateString('vi-VN');
            const exists = state.records.find(r => r.staffName === state.selectedStaff && r.dateString === dateStr);
            if (exists) {
                showToast(`Đã chấm công ngày ${dateStr} rồi!`, true);
                return;
            }

            try {
                const attendanceRef = ref(rtdb, 'attendance');
                const newRecordRef = push(attendanceRef);
                await set(newRecordRef, {
                    staffName: state.selectedStaff,
                    timestamp: Date.now(),
                    dateString: dateStr,
                    isoDate: state.checkInDate,
                    lunarDate: getLunarDate(dateObj),
                    status: 'pending'
                });
                showToast(`Đã lưu  cho ${state.selectedStaff}`);
            } catch (err) { 
                console.error("RTDB Save Error:", err);
                showToast("Lỗi: Kiểm tra Realtime Database Rules", true); 
            }
        };

        window.toggleStatus = async (id, currentStatus) => {
            try {
                const recordRef = ref(rtdb, `attendance/${id}`);
                const newStatus = currentStatus === 'pending' ? 'approved' : 'pending';
                await update(recordRef, { status: newStatus });
                showToast("Đã cập nhật trạng thái!");
            } catch (err) { 
                console.error("RTDB Update Error:", err);
                showToast("Lỗi khi cập nhật trạng thái", true); 
            }
        };

        window.adminLogin = () => {
            const pass = document.getElementById('adminPass').value;
            if (pass === '230825') {
                state.isAdminAuthenticated = true;
                render();
                showToast("Chào mừng Admin!");
            } else {
                showToast("Mật khẩu không đúng!", true);
            }
        };

        function render() {
            const container = document.getElementById('main-content');
            if (!container) return;
            container.innerHTML = '';
            
            if (state.view === 'selection' || (state.view === 'admin' && !state.isAdminAuthenticated)) {
                container.classList.add('justify-center');
            } else {
                container.classList.remove('justify-center');
            }

            if (state.view === 'selection') renderSelection(container);
            else if (state.view === 'user') renderUser(container);
            else if (state.view === 'admin') renderAdmin(container);
        }

        function renderSelection(parent) {
            const div = document.createElement('div');
            div.className = "py-16 animate-fade-in max-w-3xl mx-auto w-full";
            div.innerHTML = `
                <div class="text-center mb-16">
                    <h1 class="text-4xl font-black mb-3 uppercase tracking-tighter text-white text-center w-full">Tính lương</h1>
                    <p class="text-slate-500 uppercase text-[10px] tracking-widest font-black opacity-60 text-center w-full"></p>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 px-4">
                    ${staffList.map(name => `
                        <button onclick="router.go('user', '${name}')" class="aspect-square bg-[#151515] border border-white/5 rounded-[2.5rem] flex flex-col items-center justify-center gap-4 hover:bg-blue-600 transition-all active:scale-90 group shadow-2xl">
                            <div class="p-5 bg-white/5 rounded-2xl group-hover:bg-white/20 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-500 group-hover:text-white"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            </div>
                            <span class="font-black text-sm uppercase tracking-widest text-white text-center">${name}</span>
                        </button>
                    `).join('')}
                </div>
            `;
            parent.appendChild(div);
        }

        function renderUser(parent) {
            const div = document.createElement('div');
            div.className = "animate-fade-in max-w-5xl mx-auto py-4 px-2 w-full";
            const history = [...state.records]
                .filter(r => r.staffName === state.selectedStaff)
                .sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
            
            div.innerHTML = `
                <div class="grid md:grid-cols-5 gap-8">
                    <div class="md:col-span-3 bg-[#121212] border border-white/5 rounded-[3rem] p-8 md:p-12 shadow-2xl flex flex-col items-center justify-center text-center relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-8 opacity-[0.03]"><svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                        
                        <div class="mb-10 w-full flex flex-col items-center z-10">
                            <div class="bg-blue-600/10 text-blue-400 px-4 py-1.5 rounded-full text-[10px] font-black uppercase mb-6 border border-blue-500/20">Nhân viên: ${state.selectedStaff}</div>
                            <h2 class="text-4xl font-black uppercase mb-2 tracking-tighter text-white leading-tight text-center">Xác nhận ngày làm</h2>
                            <p class="text-slate-500 text-sm italic font-medium opacity-80">Lịch Âm : ${getLunarDate(state.checkInDate)}</p>
                        </div>
                        
                        <div class="w-full max-w-xs space-y-8 flex flex-col items-center z-10">
                            <div class="w-full space-y-3 flex flex-col items-center">
                                <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest opacity-60">Chọn ngày làm việc</label>
                                <input type="date" 
                                    max="${todayStr}" 
                                    value="${state.checkInDate}" 
                                    onchange="updateCheckInDate(this.value)" 
                                    class="uniform-size bg-black border border-white/10 rounded-2xl px-6 font-black text-2xl focus:ring-2 focus:ring-blue-500 outline-none text-center shadow-inner text-white appearance-none" />
                            </div>
                            <button onclick="handleCheckIn()" class="uniform-size bg-blue-600 hover:bg-blue-500 rounded-[2rem] font-black text-xl uppercase shadow-2xl shadow-blue-900/40 active:scale-95 transition-all text-white tracking-tighter">Gửi yêu cầu công</button>
                        </div>
                    </div>
                    
                    <div class="md:col-span-2 bg-[#121212]/60 border border-white/5 rounded-[3rem] p-8 h-[550px] flex flex-col shadow-xl">
                        <h4 class="text-[10px] font-black uppercase text-slate-500 mb-6 opacity-60 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                            Lịch sử chấm công
                        </h4>
                        <div class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                            ${history.length > 0 ? history.map(r => `
                                <div class="bg-black/40 border border-white/5 p-4 rounded-2xl flex justify-between items-center group hover:bg-white/5 transition-colors">
                                    <div class="text-left">
                                        <div class="font-black text-base text-white text-left">${r.dateString}</div>
                                        <div class="text-[9px] text-slate-500 uppercase font-bold tracking-tight text-left">${r.lunarDate}</div>
                                    </div>
                                    <div class="px-3 py-1 rounded-lg text-[9px] font-black uppercase ${r.status === 'approved' ? 'text-emerald-400 bg-emerald-400/10' : 'text-orange-400 bg-orange-400/10'}">${r.status === 'approved' ? 'Đã duyệt' : 'Chờ duyệt'}</div>
                                </div>
                            `).join('') : '<div class="h-full flex items-center justify-center opacity-20 italic font-bold text-center w-full">Chưa có dữ liệu</div>'}
                        </div>
                    </div>
                </div>
            `;
            parent.appendChild(div);
        }

        window.updateCheckInDate = (val) => { state.checkInDate = val; render(); };

        function renderAdmin(parent) {
            if (!state.isAdminAuthenticated) {
                const div = document.createElement('div');
                div.className = "max-w-md mx-auto bg-[#121212] border border-white/5 p-12 rounded-[3rem] text-center shadow-2xl relative overflow-hidden w-full";
                div.innerHTML = `
                    <div class="absolute top-0 left-0 w-full h-1 bg-blue-600"></div>
                    <h3 class="text-xl font-black mb-8 uppercase tracking-tighter text-white text-center">Xác thực Admin</h3>
                    <input type="password" id="adminPass" placeholder="••••••" class="w-full bg-black border border-white/10 rounded-2xl p-5 text-center text-3xl font-black tracking-[0.4em] focus:ring-2 focus:ring-blue-500 outline-none mb-6 shadow-inner text-white" onkeydown="if(event.key==='Enter') adminLogin()" />
                    <button onclick="adminLogin()" class="w-full bg-blue-600 py-5 rounded-2xl font-black text-sm uppercase tracking-widest shadow-xl active:scale-95 text-white">Truy cập</button>
                `;
                parent.appendChild(div);
                return;
            }

            const daysInMonth = new Date(state.currentYear, state.currentMonth + 1, 0).getDate();
            const filterRecords = state.records.filter(r => 
                r.staffName === state.adminFilterStaff && 
                new Date(r.isoDate).getMonth() === state.currentMonth && 
                new Date(r.isoDate).getFullYear() === state.currentYear
            );
            
            const div = document.createElement('div');
            div.className = "space-y-8 animate-fade-in py-6 px-2 w-full";
            div.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 bg-[#121212] p-8 rounded-[2.5rem] border border-white/5 shadow-2xl no-print">
                    <div class="flex items-center gap-6 flex-wrap">
                        <div class="flex flex-col">
                            <label class="text-[9px] font-black uppercase text-blue-500 mb-2 tracking-widest text-left">Duyệt cho nhân viên</label>
                            <select onchange="updateAdminFilter(this.value)" class="bg-black border border-white/10 rounded-xl px-4 py-2.5 text-xs font-black uppercase outline-none text-white cursor-pointer">
                                ${staffList.map(name => `<option value="${name}" ${state.adminFilterStaff === name ? 'selected' : ''}>${name}</option>`).join('')}
                            </select>
                        </div>
                        <div class="flex items-center gap-3 bg-black/40 px-4 py-2 rounded-xl border border-white/5 text-white text-center">
                            <button onclick="changeMonth(-1)" class="hover:text-blue-500"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
                            <span class="font-black uppercase text-[11px] tracking-widest">Tháng ${state.currentMonth+1}/${state.currentYear}</span>
                            <button onclick="changeMonth(1)" class="hover:text-blue-500"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
                        </div>
                    </div>
                    <button onclick="window.print()" class="bg-white/5 px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-white/10 flex items-center gap-2 text-white hover:bg-white/10 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> In Sheet</button>
                </div>

                <div class="bg-[#121212] border border-white/5 rounded-[2.5rem] p-8 no-print shadow-2xl">
                    <h3 class="text-[10px] font-black uppercase text-slate-500 mb-6 opacity-60 flex items-center gap-2 text-left">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        Danh sách Realtime của ${state.adminFilterStaff}
                    </h3>
                    <div class="max-h-[300px] overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                        ${filterRecords.length > 0 ? filterRecords.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)).map(r => `
                            <div class="bg-black/30 p-5 rounded-2xl flex justify-between items-center border border-white/5 hover:border-white/10 transition-all">
                                <div class="text-left">
                                    <div class="font-black text-lg text-white text-left">${r.dateString}</div>
                                    <div class="text-[9px] text-slate-500 uppercase font-bold tracking-tight text-left">${r.lunarDate}</div>
                                </div>
                                <button onclick="toggleStatus('${r.id}', '${r.status}')" class="px-6 py-2.5 bg-blue-600 rounded-xl font-black text-[10px] uppercase shadow-lg active:scale-95 transition-all text-white border-none cursor-pointer">
                                    ${r.status === 'pending' ? 'Duyệt công' : 'Hoàn tác'}
                                </button>
                            </div>
                        `).join('') : '<div class="py-12 text-center text-slate-700 font-black uppercase text-xs italic opacity-30 tracking-widest w-full">Chưa có ngày chấm công nào</div>'}
                    </div>
                </div>

                <div class="space-y-10 no-print">
                    <div class="bg-white rounded-[2rem] overflow-hidden shadow-2xl border border-black w-full">
                        ${renderTable("Ngày 01 - 15", 1, 15)}
                    </div>
                    <div class="bg-white rounded-[2rem] overflow-hidden shadow-2xl border border-black w-full">
                        ${renderTable("Ngày 16 - Hết", 16, daysInMonth)}
                    </div>
                </div>
            `;
            parent.appendChild(div);
        }

        window.updateAdminFilter = (val) => { state.adminFilterStaff = val; render(); };
        window.changeMonth = (step) => {
            state.currentMonth += step;
            if (state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; }
            if (state.currentMonth < 0) { state.currentMonth = 11; state.currentYear--; }
            render();
        };

        function renderTable(title, start, end) {
            const tableTotals = {};
            staffList.forEach(s => {
                tableTotals[s] = state.records.filter(r => r.staffName === s && r.status === 'approved' && 
                    new Date(r.isoDate).getMonth() === state.currentMonth && 
                    new Date(r.isoDate).getFullYear() === state.currentYear &&
                    new Date(r.isoDate).getDate() >= start && new Date(r.isoDate).getDate() <= end).length;
            });

            return `
                <div class="overflow-x-auto w-full custom-scrollbar">
                    <table class="w-full border-collapse text-black text-[9px] font-black">
                        <thead>
                            <tr class="bg-[#FFFF00] border-b border-black">
                                <th class="py-2 px-2 border-r border-black w-10 bg-slate-200"></th>
                                <th colSpan="${staffList.length}" class="py-3 text-center font-black uppercase text-base border-black tracking-[0.3em]">${title}</th>
                            </tr>
                            <tr class="bg-[#FF0000] text-black">
                                <th class="py-2 border-r border-black text-center bg-slate-100">Ngày</th>
                                ${staffList.map(name => `<th class="py-2 border-r border-black font-black uppercase text-center min-w-[85px] tracking-widest">${name}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody class="bg-[#A9D08E]">
                            ${Array.from({length: end - start + 1}, (_, i) => {
                                const day = start + i;
                                const dateStr = new Date(state.currentYear, state.currentMonth, day).toLocaleDateString('vi-VN');
                                return `
                                    <tr class="border-b border-black/20 h-9">
                                        <td class="bg-[#BDD7EE] border-r border-black px-2 font-black text-center text-sm">${day}</td>
                                        ${staffList.map(name => {
                                            const rec = state.records.find(r => r.staffName === name && r.dateString === dateStr);
                                            return `<td class="border-r border-black/20 text-center relative">
                                                ${rec ? (rec.status === 'approved' ? '<div class="w-6 h-6 bg-black rounded flex items-center justify-center text-white mx-auto shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' : '<div class="w-5 h-5 border-2 border-black/30 bg-white/20 rounded-full flex items-center justify-center text-[9px] mx-auto opacity-40 font-black text-black">?</div>') : ''}
                                            </td>`;
                                        }).join('')}
                                    </tr>
                                `;
                            }).join('')}
                            <tr class="bg-white font-black text-black uppercase border-t-4 border-black text-center">
                                <td class="border-r border-black py-4 text-center bg-slate-200 text-[11px] tracking-widest">TỔNG</td>
                                ${staffList.map(name => `<td class="border-r border-black py-4 text-center text-2xl font-black text-blue-800 italic tracking-tighter">${tableTotals[name]}</td>`).join('')}
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Bắt đầu ứng dụng: Khởi tạo Realtime Database listener
        let isDataInitialized = false;
        onAuthStateChanged(auth, async (u) => {
            state.user = u;
            if (!u) {
                try { await signInAnonymously(auth); } catch (e) { console.error("Auth Error:", e); }
            }
            
            if (!isDataInitialized && u) {
                isDataInitialized = true;
                const attendanceRef = ref(rtdb, 'attendance');
                onValue(attendanceRef, (snapshot) => {
                    const data = snapshot.val();
                    const list = [];
                    if (data) {
                        for (let id in data) {
                            list.push({ id, ...data[id] });
                        }
                    }
                    state.records = list;
                    render();
                }, (err) => {
                    console.error("RTDB Error:", err);
                    showToast("Lỗi tải Realtime DB. Kiểm tra Rules.", true);
                });
            } else {
                render();
            }
        });




        let isLight = false;

window.toggleTheme = () => {
    const body = document.body;
    const btn = document.getElementById("themeBtn");

    if (!isLight) {
        body.style.background = "#f5f5f5";
        body.style.color = "#111";
        btn.innerHTML = "🌙";
    } else {
        body.style.background = "#0a0a0a";
        body.style.color = "#cbd5e1";
        btn.innerHTML = "☀️";
    }

    isLight = !isLight;
};
    </script>
