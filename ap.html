<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Thương tính tiền</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; font-size: 13px; background-color: #0a0a0a; color: #cbd5e1; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        @media print { .no-print { display: none !important; } .print-only { display: block !important; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .uniform-size {
            width: 100%;
            max-width: 320px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        input[type="date"] {
            color-scheme: dark;
        }
    </style>
</head>
<body>

    <div id="app" class="min-h-screen flex flex-col">
        <nav class="sticky top-0 z-50 bg-black/60 backdrop-blur-xl border-b border-white/5 px-4 py-3 flex justify-between items-center no-print">
            <div class="flex items-center gap-2 cursor-pointer" onclick="router.go('selection')">
                <div class="bg-blue-600 p-1 rounded-md shadow-lg shadow-blue-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <span class="font-black uppercase tracking-tight text-sm text-white">Công Thương tính tiền</span>
            </div>
            <div class="flex gap-2">
                <button onclick="window.location.href='index.html'" class="p-2 rounded-lg bg-white/5 text-slate-400 border border-white/10 transition-all hover:text-white text-[10px] font-black uppercase">báo cước</button>
                <button id="exitBtn" class="hidden px-3 py-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-[10px] uppercase font-black transition-all text-white border border-white/10" onclick="router.go('selection')">Thoát</button>
                <button id="adminBtn" class="p-2 rounded-lg bg-white/5 text-slate-400 border border-white/10 transition-all hover:text-white" onclick="router.toggleAdmin()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </button>
            </div>
        </nav>

        <main id="main-content" class="max-w-[1600px] mx-auto w-full p-4 md:p-6 flex-1 flex flex-col items-center justify-center">
            <div id="loading-spinner" class="flex flex-col items-center gap-4">
                <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="font-black uppercase text-[10px] tracking-widest opacity-50">Đang khởi tạo kết nối Realtime...</p>
            </div>
        </main>

        <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-6 py-2.5 rounded-full shadow-2xl flex items-center gap-2 border bg-blue-600/90 border-blue-400 hidden animate-fade-in">
            <span id="toast-text" class="font-black text-[11px] text-white uppercase tracking-tight">Thông báo</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCF16Ze3NczHi3B3NU2-y4QJzdx35dKpsY",
            authDomain: "chamcong-1cbc1.firebaseapp.com",
            databaseURL: "https://chamcong-1cbc1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chamcong-1cbc1",
            storageBucket: "chamcong-1cbc1.firebasestorage.app",
            messagingSenderId: "1037808997570",
            appId: "1:1037808997570:web:0c3bd96af91a30edc9975b",
            measurementId: "G-LR48BVDHY3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const rtdb = getDatabase(app);

        const staffList = [
            { name: 'Đô', img: 'https://scontent.fhan3-3.fna.fbcdn.net/v/t39.30808-1/560906553_1748167296571620_7462719450984680579_n.jpg?stp=cp6_dst-jpg_s200x200_tt6&_nc_cat=101&ccb=1-7&_nc_sid=1d2534&_nc_ohc=wmKhYLrax58Q7kNvwFRMeR7&_nc_oc=Admp7_2FnHPIxJh_AR9j7ZBdzSt-_7xAyBeRl2nXacmtQ9VggOGYnM9_W9HZXL-SFUU&_nc_zt=24&_nc_ht=scontent.fhan3-3.fna&_nc_gid=sQ8d9numzLhre52U1Z0Ssg&_nc_ss=8&oh=00_AfwR7YNhH66GvZf0ySZUQK57NY2HH09Dmo_4SDOReTjanQ&oe=69B451FB' },
            { name: 'Em', img: 'image.jpg' },
            { name: 'Hưng', img: 'https://scontent.fhan3-3.fna.fbcdn.net/v/t39.30808-1/643896663_1284159833774022_1543685287178262949_n.jpg?stp=dst-jpg_s200x200_tt6&_nc_cat=111&ccb=1-7&_nc_sid=e99d92&_nc_ohc=bgfxxPHobToQ7kNvwFBsWYI&_nc_oc=AdkM1PtTlUFdhsQQkcaLHe7swnDpQuodPgsKZ_S4bG_whJjlBtmgqfRhJOu5KhogJmQ&_nc_zt=24&_nc_ht=scontent.fhan3-3.fna&_nc_gid=pTcwJPdbeJc7fqu3inSY9Q&_nc_ss=8&oh=00_AfwtdG6pYW5qth6o0u5AYh9pLYVWtIUcxLzQZYcx0PFymA&oe=69B43F24' },
            { name: 'Khang', img: 'image2.jpg' }
        ];

        let state = {
            user: null,
            view: 'selection',
            selectedStaff: null,
            isAdminAuthenticated: false,
            isUserAuthenticated: false,
            records: [],
            adminFilterStaff: staffList[0].name,
            currentMonth: new Date().getMonth(),
            currentYear: new Date().getFullYear(),
            checkInDate: new Date().toISOString().split('T')[0]
        };

        const todayStr = new Date().toISOString().split('T')[0];
        const TIMEZONE = 7;

        // --- ALGORITHM HỒ NGỌC ĐỨC ---
        function jdFromDate(d, m, y) {
            let a = Math.floor((14 - m) / 12);
            y = y + 4800 - a;
            m = m + 12 * a - 3;
            return d + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
        }

        function getNewMoonDay(k, timezone) {
            let T = k / 1236.85;
            let T2 = T * T;
            let T3 = T2 * T;
            let dr = Math.PI / 180;
            let JDE = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
            let M = dr * (359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3);
            let Mprime = dr * (306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3);
            let F = dr * (21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3);
            let correction = (0.1734 - 0.000393 * T) * Math.sin(M) + 0.0021 * Math.sin(2 * M) - 0.4068 * Math.sin(Mprime) + 0.0161 * Math.sin(2 * Mprime) - 0.0004 * Math.sin(3 * Mprime) + 0.0104 * Math.sin(F) - 0.0051 * Math.sin(M + Mprime) - 0.0074 * Math.sin(M - Mprime) + 0.0004 * Math.sin(2 * F + M) - 0.0004 * Math.sin(2 * F - M) - 0.0006 * Math.sin(2 * F + Mprime) + 0.0104 * Math.sin(2 * F - Mprime) + 0.0005 * Math.sin(M + 2 * Mprime);
            return JDE + correction + timezone / 24;
        }

        function getSunLongitude(jdn, timezone) {
            let T = (jdn - 2451545.0) / 36525;
            let L = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
            let M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
            let C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M * Math.PI / 180) + (0.019993 - 0.000101 * T) * Math.sin(2 * M * Math.PI / 180) + 0.000289 * Math.sin(3 * M * Math.PI / 180);
            let lambda = L + C;
            while (lambda < 0) lambda += 360;
            while (lambda >= 360) lambda -= 360;
            return lambda;
        }

        function getLunarMonth11(yy, timezone) {
            let off = jdFromDate(31, 12, yy) - 2415021;
            let k = Math.floor(off / 29.53058868);
            let nm = getNewMoonDay(k, timezone);
            let sunLong = getSunLongitude(nm, timezone);
            if (sunLong >= 270) nm = getNewMoonDay(k - 1, timezone);
            return Math.floor(nm + 0.5);
        }

        function getLeapMonthOffset(a11, b11, timezone) {
            let k = Math.floor((b11 - a11) / 29.53058868 + 0.5);
            if (k <= 12) return -1;
            let last = 0, i = 1;
            while (i <= k) {
                let nm = getNewMoonDay(Math.floor((a11 - 2415021) / 29.53058868 + 0.5) + i, timezone);
                let sunLong = Math.floor(getSunLongitude(nm, timezone) / 30);
                if (sunLong === last) return i;
                last = sunLong; i++;
            }
            return -1;
        }

        function getLunarDate(dateInput) {
            const d = new Date(dateInput);
            const dd = d.getDate();
            const mm = d.getMonth() + 1;
            const yy = d.getFullYear();
            let day = jdFromDate(dd, mm, yy);
            let a11 = getLunarMonth11(yy, TIMEZONE);
            if (day < a11) a11 = getLunarMonth11(yy - 1, TIMEZONE);
            let b11 = getLunarMonth11(yy + 1, TIMEZONE);
            if (day >= b11) a11 = b11;
            let k = Math.floor((day - a11) / 29.53058868 + 0.5);
            let nm = Math.floor(getNewMoonDay(Math.floor((a11 - 2415021) / 29.53058868 + 0.5) + k, TIMEZONE) + 0.5);
            if (nm > day) {
                k--;
                nm = Math.floor(getNewMoonDay(Math.floor((a11 - 2415021) / 29.53058868 + 0.5) + k, TIMEZONE) + 0.5);
            }
            let lunarDay = day - nm + 1;
            let displayDay = lunarDay + 1;
            let diff = Math.floor((nm - a11) / 29.53058868 + 0.5);
            let leapMonth = getLeapMonthOffset(a11, b11, TIMEZONE);
            let isLeap = false;
            if (leapMonth !== -1 && diff >= leapMonth) {
                if (diff === leapMonth) isLeap = true;
                diff--;
            }
            let lunarMonth = (diff + 10) % 12 + 1;
            return `${displayDay}/${lunarMonth}${isLeap ? '(N)' : ''} (Âm)`;
        }

        // --- CORE FUNCTIONS ---
        const showToast = (text, isError = false) => {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            toast.className = `fixed top-16 left-1/2 -translate-x-1/2 z-[60] px-6 py-2.5 rounded-full shadow-2xl flex items-center gap-2 border ${isError ? 'bg-red-500/90 border-red-400' : 'bg-blue-600/90 border-blue-400'} animate-fade-in`;
            toastText.innerText = text;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        };

        window.router = {
            go: (view, staff = null) => {
                state.view = view;
                state.selectedStaff = staff;
                state.isUserAuthenticated = false; // Reset login khi chuyển view
                if (view === 'selection') {
                    state.isAdminAuthenticated = false;
                    document.getElementById('exitBtn').classList.add('hidden');
                } else {
                    document.getElementById('exitBtn').classList.remove('hidden');
                }
                render();
            },
            toggleAdmin: () => {
                state.view = 'admin';
                render();
            }
        };

        // --- PASSWORD LOGIC ---
        window.userLogin = async () => {
            const passInput = document.getElementById('userPass').value;
            const userRef = ref(rtdb, `users/${state.selectedStaff}`);
            
            onValue(userRef, async (snapshot) => {
                const userData = snapshot.val();
                const correctPass = userData?.password || '123'; 
                const isFirst = userData?.isFirstLogin !== false;

                if (passInput === correctPass) {
                    if (isFirst) {
                        promptChangePassword(true);
                    } else {
                        state.isUserAuthenticated = true;
                        render();
                    }
                } else {
                    showToast("Sai mật khẩu!", true);
                }
            }, { onlyOnce: true });
        };

        window.promptChangePassword = (isFirst = false) => {
            const newPass = prompt(isFirst ? "Lần đầu đăng nhập. Đặt mật khẩu mới (ít nhất 3 ký tự):" : "Nhập mật khẩu mới:");
            if (newPass && newPass.length >= 3) {
                const userRef = ref(rtdb, `users/${state.selectedStaff}`);
                update(userRef, {
                    password: newPass,
                    isFirstLogin: false
                }).then(() => {
                    showToast("Đã đổi mật khẩu thành công!");
                    state.isUserAuthenticated = true;
                    render();
                });
            } else {
                showToast("Mật khẩu không hợp lệ hoặc bị hủy", true);
            }
        };

        window.adminLogin = () => {
            const pass = document.getElementById('adminPass').value;
            if (pass === '230825') {
                state.isAdminAuthenticated = true;
                render();
                showToast("Chào mừng Admin!");
            } else {
                showToast("Mật khẩu không đúng!", true);
            }
        };

        // --- DATABASE OPERATIONS ---
        window.handleCheckIn = async () => {
            if (!state.user) return;
            if (state.checkInDate > todayStr) {
                showToast("Không thể chấm công ngày tương lai!", true);
                return;
            }
            const dateObj = new Date(state.checkInDate);
            const dateStr = dateObj.toLocaleDateString('vi-VN');
            const exists = state.records.find(r => r.staffName === state.selectedStaff && r.dateString === dateStr);
            if (exists) {
                showToast(`Đã chấm công ngày ${dateStr} rồi!`, true);
                return;
            }
            try {
                const attendanceRef = ref(rtdb, 'attendance');
                const newRecordRef = push(attendanceRef);
                await set(newRecordRef, {
                    staffName: state.selectedStaff,
                    timestamp: Date.now(),
                    dateString: dateStr,
                    isoDate: state.checkInDate,
                    lunarDate: getLunarDate(dateObj),
                    status: 'pending'
                });
                showToast(`Đã gửi yêu cầu cho ${state.selectedStaff}`);
            } catch (err) { showToast("Lỗi kết nối DB", true); }
        };

        window.deleteRecord = async (id) => {
            if (confirm("Xóa ngày chấm công này?")) {
                try {
                    await remove(ref(rtdb, `attendance/${id}`));
                    showToast("Đã xóa thành công!");
                } catch (err) { showToast("Lỗi khi xóa", true); }
            }
        };

        window.toggleStatus = async (id, currentStatus) => {
            try {
                await update(ref(rtdb, `attendance/${id}`), { 
                    status: currentStatus === 'pending' ? 'approved' : 'pending' 
                });
            } catch (err) { showToast("Lỗi cập nhật", true); }
        };

        // --- RENDER FUNCTIONS ---
        function render() {
            const container = document.getElementById('main-content');
            if (!container) return;
            container.innerHTML = '';
            
            if (state.view === 'selection' || (state.view === 'admin' && !state.isAdminAuthenticated) || (state.view === 'user' && !state.isUserAuthenticated)) {
                container.classList.add('justify-center');
            } else {
                container.classList.remove('justify-center');
            }

            if (state.view === 'selection') renderSelection(container);
            else if (state.view === 'user') renderUser(container);
            else if (state.view === 'admin') renderAdmin(container);
        }

        function renderSelection(parent) {
            const div = document.createElement('div');
            div.className = "py-16 animate-fade-in max-w-3xl mx-auto w-full";
            div.innerHTML = `
                <div class="text-center mb-16">
                    <h1 class="text-4xl font-black mb-3 uppercase tracking-tighter text-white">Tính lương</h1>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 px-4">
                    ${staffList.map(staff => `
                        <button onclick="router.go('user', '${staff.name}')" class="aspect-square bg-[#151515] border border-white/5 rounded-[2.5rem] flex flex-col items-center justify-center gap-4 hover:bg-blue-600 transition-all active:scale-90 group shadow-2xl">
                            <div class="w-20 h-20 rounded-2xl overflow-hidden border-2 border-white/10 group-hover:border-white/30 transition-colors">
                                <img src="${staff.img}" alt="${staff.name}" class="w-full h-full object-cover">
                            </div>
                            <span class="font-black text-sm uppercase tracking-widest text-white">${staff.name}</span>
                        </button>
                    `).join('')}
                </div>
            `;
            parent.appendChild(div);
        }

        function renderUser(parent) {
            if (!state.isUserAuthenticated) {
                const loginDiv = document.createElement('div');
                loginDiv.className = "max-w-md mx-auto bg-[#121212] border border-white/5 p-10 rounded-[3rem] text-center shadow-2xl w-full animate-fade-in";
                loginDiv.innerHTML = `
                    <h3 class="text-xl font-black mb-6 uppercase text-white">Tên: ${state.selectedStaff}</h3>
                    <input type="password" id="userPass" placeholder="Nhập mật khẩu" class="w-full bg-black border border-white/10 rounded-2xl p-4 text-center text-xl mb-4 text-white outline-none focus:ring-2 focus:ring-blue-600" onkeydown="if(event.key==='Enter') userLogin()" />
                    <button onclick="userLogin()" class="w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-white hover:bg-blue-500 transition-all">Đăng nhập</button>
                    <p class="text-[10px] text-slate-500 mt-4 uppercase">Mật khẩu mặc định: 123</p>
                `;
                parent.appendChild(loginDiv);
                return;
            }

            const history = [...state.records]
                .filter(r => r.staffName === state.selectedStaff)
                .sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
            
            const div = document.createElement('div');
            div.className = "animate-fade-in max-w-5xl mx-auto py-4 px-2 w-full";
            div.innerHTML = `
                <div class="grid md:grid-cols-5 gap-8">
                    <div class="md:col-span-3 bg-[#121212] border border-white/5 rounded-[3rem] p-8 md:p-12 shadow-2xl flex flex-col items-center justify-center text-center relative overflow-hidden">
                        <div class="mb-10 w-full flex flex-col items-center z-10">
                            <div class="bg-blue-600/10 text-blue-400 px-4 py-1.5 rounded-full text-[10px] font-black uppercase mb-2 border border-blue-500/20">Nhân viên: ${state.selectedStaff}</div>
                            <button onclick="promptChangePassword()" class="text-[9px] text-slate-500 underline hover:text-white mb-6 uppercase font-bold">Đổi mật khẩu?</button>
                            <h2 class="text-4xl font-black uppercase mb-2 tracking-tighter text-white">Xác nhận ngày làm</h2>
                            <p class="text-slate-500 text-sm italic font-medium opacity-80">Lịch Âm : ${getLunarDate(state.checkInDate)}</p>
                        </div>
                        <div class="w-full max-w-xs space-y-8 flex flex-col items-center z-10">
                            <div class="w-full space-y-3 flex flex-col items-center">
                                <input type="date" max="${todayStr}" value="${state.checkInDate}" onchange="updateCheckInDate(this.value)" class="uniform-size bg-black border border-white/10 rounded-2xl px-6 font-black text-2xl text-center text-white" />
                            </div>
                            <button onclick="handleCheckIn()" class="uniform-size bg-blue-600 hover:bg-blue-500 rounded-[2rem] font-black text-xl uppercase text-white shadow-xl active:scale-95 transition-all">Gửi yêu cầu</button>
                        </div>
                    </div>
                    <div class="md:col-span-2 bg-[#121212]/60 border border-white/5 rounded-[3rem] p-8 h-[550px] flex flex-col shadow-xl">
                        <h4 class="text-[10px] font-black uppercase text-slate-500 mb-6 opacity-60">Lịch sử chấm công</h4>
                        <div class="flex-1 overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                            ${history.length > 0 ? history.map(r => `
                                <div class="bg-black/40 border border-white/5 p-4 rounded-2xl flex justify-between items-center">
                                    <div class="text-left">
                                        <div class="font-black text-base text-white">${r.dateString}</div>
                                        <div class="text-[9px] text-slate-500 uppercase font-bold">${r.lunarDate}</div>
                                    </div>
                                    <div class="px-3 py-1 rounded-lg text-[9px] font-black uppercase ${r.status === 'approved' ? 'text-emerald-400 bg-emerald-400/10' : 'text-orange-400 bg-orange-400/10'}">${r.status === 'approved' ? 'Đã duyệt' : 'Chờ duyệt'}</div>
                                </div>
                            `).join('') : '<div class="h-full flex items-center justify-center opacity-20 italic font-bold">Chưa có dữ liệu</div>'}
                        </div>
                    </div>
                </div>
            `;
            parent.appendChild(div);
        }

        window.updateCheckInDate = (val) => { state.checkInDate = val; render(); };
        window.updateAdminFilter = (val) => { state.adminFilterStaff = val; render(); };
        window.changeMonth = (step) => {
            state.currentMonth += step;
            if (state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; }
            if (state.currentMonth < 0) { state.currentMonth = 11; state.currentYear--; }
            render();
        };

        function renderAdmin(parent) {
            if (!state.isAdminAuthenticated) {
                const div = document.createElement('div');
                div.className = "max-w-md mx-auto bg-[#121212] border border-white/5 p-12 rounded-[3rem] text-center shadow-2xl relative overflow-hidden w-full";
                div.innerHTML = `
                    <div class="absolute top-0 left-0 w-full h-1 bg-blue-600"></div>
                    <h3 class="text-xl font-black mb-8 uppercase text-white">Xác thực Admin</h3>
                    <input type="password" id="adminPass" placeholder="••••••" class="w-full bg-black border border-white/10 rounded-2xl p-5 text-center text-3xl font-black tracking-[0.4em] text-white outline-none mb-6" onkeydown="if(event.key==='Enter') adminLogin()" />
                    <button onclick="adminLogin()" class="w-full bg-blue-600 py-5 rounded-2xl font-black uppercase text-white">Truy cập</button>
                `;
                parent.appendChild(div);
                return;
            }

            const daysInMonth = new Date(state.currentYear, state.currentMonth + 1, 0).getDate();
            const filterRecords = state.records.filter(r => 
                r.staffName === state.adminFilterStaff && 
                new Date(r.isoDate).getMonth() === state.currentMonth && 
                new Date(r.isoDate).getFullYear() === state.currentYear
            );
            
            const div = document.createElement('div');
            div.className = "space-y-8 animate-fade-in py-6 px-2 w-full";
            div.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 bg-[#121212] p-8 rounded-[2.5rem] border border-white/5 shadow-2xl no-print">
                    <div class="flex items-center gap-6 flex-wrap">
                        <div class="flex flex-col">
                            <label class="text-[9px] font-black uppercase text-blue-500 mb-2">Duyệt cho nhân viên</label>
                            <select onchange="updateAdminFilter(this.value)" class="bg-black border border-white/10 rounded-xl px-4 py-2.5 text-xs font-black uppercase text-white outline-none">
                                ${staffList.map(s => `<option value="${s.name}" ${state.adminFilterStaff === s.name ? 'selected' : ''}>${s.name}</option>`).join('')}
                            </select>
                        </div>
                        <div class="flex items-center gap-3 bg-black/40 px-4 py-2 rounded-xl border border-white/5 text-white">
                            <button onclick="changeMonth(-1)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
                            <span class="font-black uppercase text-[11px]">Tháng ${state.currentMonth+1}/${state.currentYear}</span>
                            <button onclick="changeMonth(1)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
                        </div>
                    </div>
                    <button onclick="window.print()" class="bg-white/5 px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-white/10 text-white flex items-center gap-2">In Sheet</button>
                </div>

                <div class="bg-[#121212] border border-white/5 rounded-[2.5rem] p-8 no-print shadow-2xl">
                    <h3 class="text-[10px] font-black uppercase text-slate-500 mb-6">Yêu cầu từ ${state.adminFilterStaff}</h3>
                    <div class="max-h-[300px] overflow-y-auto space-y-3 pr-2 custom-scrollbar">
                        ${filterRecords.length > 0 ? filterRecords.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)).map(r => `
                            <div class="bg-black/30 p-5 rounded-2xl flex justify-between items-center border border-white/5">
                                <div class="text-left">
                                    <div class="font-black text-lg text-white">${r.lunarDate}</div>
                                    <div class="text-[9px] text-slate-500 uppercase font-bold">Dương: ${r.dateString}</div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="toggleStatus('${r.id}', '${r.status}')" class="px-6 py-2.5 bg-blue-600 rounded-xl font-black text-[10px] uppercase text-white">
                                        ${r.status === 'pending' ? 'Duyệt công' : 'Hoàn tác'}
                                    </button>
                                    <button onclick="deleteRecord('${r.id}')" class="p-2.5 text-red-500 bg-red-500/10 rounded-xl hover:bg-red-500 hover:text-white transition-all">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                                    </button>
                                </div>
                            </div>
                        `).join('') : '<div class="py-12 text-center text-slate-700 italic">Trống</div>'}
                    </div>
                </div>

                <div class="space-y-10">
                    <div class="bg-white rounded-[2rem] overflow-hidden shadow-2xl border border-black">${renderTable("Ngày 01 - 15 ", 1, 15)}</div>
                    <div class="bg-white rounded-[2rem] overflow-hidden shadow-2xl border border-black">${renderTable("Ngày 16 - Hết ", 16, daysInMonth)}</div>
                </div>
            `;
            parent.appendChild(div);
        }

        function renderTable(title, start, end) {
            const tableTotals = {};
            const staffNames = staffList.map(s => s.name);
            staffNames.forEach(name => {
                tableTotals[name] = state.records.filter(r => {
                    if (r.staffName !== name || r.status !== 'approved') return false;
                    const lunarDayNum = parseInt(r.lunarDate.split('/')[0]);
                    return lunarDayNum >= start && lunarDayNum <= end;
                }).length;
            });

            return `
                <div class="overflow-x-auto w-full custom-scrollbar">
                    <table class="w-full border-collapse text-black text-[9px] font-black">
                        <thead>
                            <tr class="bg-[#FFFF00] border-b border-black">
                                <th class="py-2 px-2 border-r border-black bg-slate-200"></th>
                                <th colSpan="${staffNames.length}" class="py-3 text-center uppercase text-base tracking-[0.3em]">${title}</th>
                            </tr>
                            <tr class="bg-[#FF0000] text-black">
                                <th class="py-2 border-r border-black text-center bg-slate-100 italic">Ngày Âm</th>
                                ${staffNames.map(name => `<th class="py-2 border-r border-black text-center min-w-[85px] tracking-widest uppercase">${name}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody class="bg-[#A9D08E]">
                            ${Array.from({length: end - start + 1}, (_, i) => {
                                const currentDay = start + i;
                                return `
                                    <tr class="border-b border-black/20 h-9">
                                        <td class="bg-[#BDD7EE] border-r border-black px-2 text-center text-sm">${currentDay}</td>
                                        ${staffNames.map(name => {
                                            const rec = state.records.find(r => {
                                                if (r.staffName !== name) return false;
                                                return parseInt(r.lunarDate.split('/')[0]) === currentDay;
                                            });
                                            return `<td class="border-r border-black/20 text-center">
                                                ${rec && rec.status === 'approved' ? '<div class="w-6 h-6 bg-black rounded flex items-center justify-center text-white mx-auto"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg></div>' : (rec ? '<span class="opacity-30">?</span>' : '')}
                                            </td>`;
                                        }).join('')}
                                    </tr>
                                `;
                            }).join('')}
                            <tr class="bg-white border-t-4 border-black text-center">
                                <td class="border-r border-black py-4 bg-slate-200 text-[11px] tracking-widest">TỔNG</td>
                                ${staffNames.map(name => `<td class="border-r border-black py-4 text-2xl text-blue-800 italic">${tableTotals[name]}</td>`).join('')}
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        // --- AUTH OBSERVER ---
        onAuthStateChanged(auth, async (u) => {
            state.user = u;
            if (!u) {
                try { await signInAnonymously(auth); } catch (e) { console.error(e); }
            }
            if (u) {
                onValue(ref(rtdb, 'attendance'), (snapshot) => {
                    const data = snapshot.val();
                    const list = [];
                    for (let id in data) { list.push({ id, ...data[id] }); }
                    state.records = list;
                    render();
                });
            }
        });
    </script>
</body>
</html>
