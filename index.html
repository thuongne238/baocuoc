    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CẤU HÌNH CSDL FIREBASE MỚI
        const firebaseConfig = {
            apiKey: "AIzaSyBUx8FVx4uUUper36ONs0amSC9zgeR55pg",
            authDomain: "actw-e8828.firebaseapp.com",
            databaseURL: "https://actw-e8828-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "actw-e8828",
            storageBucket: "actw-e8828.firebasestorage.app",
            messagingSenderId: "526382369405",
            appId: "1:526382369405:web:3ce11268c1718572ec7f14",
            measurementId: "G-LXVFY1T3EP"
        };

        // --- HỆ THỐNG GHI NHẬT KÝ (LOGGING) & THEO DÕI LỖI ---
        const systemLogs = [];
        function addLog(type, msg, detail = null) {
            const time = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌' : type === 'warn' ? '⚠️' : type === 'success' ? '✅' : 'ℹ️';
            const logStr = `[${time}] ${prefix} ${msg}`;
            if (type === 'error') console.error(logStr, detail || '');
            else if (type === 'warn') console.warn(logStr, detail || '');
            else console.log(logStr, detail || '');

            systemLogs.push({ 
                time, 
                type, 
                msg, 
                detail: detail ? (detail.message || (typeof detail === 'object' ? JSON.stringify(detail) : String(detail))) : null 
            });
            if (systemLogs.length > 250) systemLogs.shift();
            renderLogUI();
        }

        function renderLogUI() {
            const box = document.getElementById('log-container');
            if (!box) return;
            box.innerHTML = systemLogs.map(l => {
                const color = l.type === 'error' ? '#ff6b6b' : l.type === 'warn' ? '#ffd166' : l.type === 'success' ? '#06d6a0' : '#4cc9f0';
                return `<div style="margin-bottom:6px;"><span style="color:#888;">[${l.time}]</span> <span style="color:${color}; font-weight:bold;">[${l.type.toUpperCase()}]</span> ${escapeHtml(l.msg)}${l.detail ? '<br><span style="color:#ff8787; font-size:11px; margin-left:15px; display:inline-block;">Chi tiết: ' + escapeHtml(l.detail) + '</span>' : ''}</div>`;
            }).join('');
            box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        window.openLogModal = () => {
            renderLogUI();
            document.getElementById('log-modal').classList.remove('hidden');
        };

        window.clearLogs = () => {
            systemLogs.length = 0;
            addLog('info', 'Đã làm mới danh sách log.');
        };

        window.copyLogsToClipboard = async () => {
            if (systemLogs.length === 0) return alert('Chưa có log nào!');
            const text = systemLogs.map(l => `[${l.time}] [${l.type.toUpperCase()}] ${l.msg}${l.detail ? ' | ' + l.detail : ''}`).join('\n');
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                alert('Đã sao chép toàn bộ nhật ký vào clipboard!');
            } catch(e) {
                alert('Lỗi sao chép: ' + e.message);
            }
        };

        // Ghi log khởi tạo
        addLog('info', 'Khởi tạo ứng dụng với Project: ' + firebaseConfig.projectId + ' (' + firebaseConfig.databaseURL + ')');

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            addLog('success', 'Đã khởi tạo Firebase SDK thành công.');
        } catch (e) {
            addLog('error', 'Lỗi khởi tạo Firebase SDK: ' + e.message, e);
        }

        const REF_MASTER = "master_data";
        const REF_INPUT = "input_data";
        const REF_RESULT_HISTORY = "result_history";
        const MANAGER_PASS = "2308";

        let currentUser = "";
        let pendingData = [];
        let localMasterData = [];
        let localInputData = [];
        let passwordAction = 'LOGIN'; 

        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        
        // --- 1. XỬ LÝ MẬT KHẨU CHUNG ---
        window.checkManagerLogin = () => {
            passwordAction = 'LOGIN';
            document.getElementById('password-title').innerText = "🔒 Đăng nhập ";
            document.getElementById('manager-password').value = '';
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('manager-password').focus();
        };

        window.triggerResetAll = () => {
            passwordAction = 'RESET';
            document.getElementById('password-title').innerText = "⚠️ Xác nhận Xóa dữ liệu";
            document.getElementById('manager-password').value = '';
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('manager-password').focus();
        };

        window.handlePasswordSubmit = () => {
            const pass = document.getElementById('manager-password').value;
            
            if (pass !== MANAGER_PASS) {
                addLog('warn', 'Nhập sai mật khẩu quản lý.');
                alert("❌ Mật khẩu không đúng!");
                return;
            }

            window.closeModal('password-modal');
            
            if (passwordAction === 'LOGIN') {
                currentUser = "Tí Đô";

            try {
                addLog('info', `User [${currentUser}] đang gửi đợt nhập gồm ${pendingData.length} mục lên Firebase...`);
                const totalQty = pendingData.reduce((sum, item) => sum + item.quantity, 0);
                const batchPayload = {
                    checkerName: currentUser,
                    timestamp: Date.now(),
                    items: pendingData,
                    totalBatchQty: totalQty
                };

                const newRef = push(ref(db, REF_INPUT));

                addLog('success', `Đã lưu thành công tour nhập của [${currentUser}] (Tổng: ${totalQty} thùng).`);

        // --- 4. LỊCH SỬ ---

        // --- 5. TÌM KIẾM ---
        window.openSearchModal = () => {

        window.managerSearch = () => {
            const k = document.getElementById('search-input').value.trim().toUpperCase();
            const res = document.getElementById('search-results');
            res.innerHTML = '';

            let userBatchMap = {};
            let sortedBatches = [...localInputData].sort((a,b) => a.timestamp - b.timestamp);

                if(!userBatchMap[b.checkerName]) userBatchMap[b.checkerName] = [];
                userBatchMap[b.checkerName].push(b);
            });

            [...localInputData].sort((a,b) => b.timestamp - a.timestamp).forEach(batch => {
                if(batch.items) {
                    const found = batch.items.find(i => i.receiver.includes(k));
                    if(found) {
                        const idx = userBatchMap[batch.checkerName].findIndex(b => b.id === batch.id) + 1;

                                <div style="font-size:13px; margin-top:5px;">

        // --- 6. REALTIME SYNC & GIÁM SÁT KẾT NỐI ---
        if (db) {
            // Lắng nghe trạng thái kết nối tới máy chủ Firebase

            });

        function updatePillStats() {
            const countEl = document.getElementById('data-count-pill');
            if (countEl) {

            }
        }

        function renderTable() {
            const mData = {};
            localMasterData.forEach(i => {
                const k = i.receiver.toUpperCase().trim();
                if(!mData[k]) mData[k] = {name: i.receiver, exp:0};
                mData[k].exp += i.expectedQuantity;
            });
            const iData = {};
            localInputData.forEach(batch => {
                if(batch.items) {
                    batch.items.forEach(item => {
                        const k = item.receiver.toUpperCase().trim();
                        if(!iData[k]) iData[k] = 0;
                        iData[k] += item.quantity;
                    });
                }
            });
            const tbody = document.getElementById('comparison-body');
            tbody.innerHTML = '';

            const hasMaster = Object.keys(mData).length > 0;
            const hasInput = Object.keys(iData).length > 0;

            if (!hasMaster && !hasInput) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:25px; color:#6c757d; line-height:1.6;">
                    ⚠️ <b>Chưa có dữ liệu cước gốc trong CSDL mới</b><br>
                    <span style="font-size:12px; color:#888;">Quản lý đăng nhập <b>TÍ ĐÔ</b> ➔ <b>Upload Excel</b> để nạp bảng cước</span>
                </td></tr>`;
                return;
            }

            for(let k in mData) {
                const act = iData[k] || 0;
                const exp = mData[k].exp;
                let st = 'OK', cls = 'status-OK';
                if(act > exp) { st = 'DƯ'; cls = 'status-DU'; }
                if(act < exp) { st = 'THIẾU'; cls = 'status-THIEU'; }
                tbody.innerHTML += `<tr><td>${mData[k].name}</td><td align="center">${exp}</td><td align="center">${act}</td><td align="center" class="${cls}">${st}</td></tr>`;
            }
            for(let k in iData) {
                if(!mData[k]) tbody.innerHTML += `<tr class="row-stranger"><td>${k} (Lạ)</td><td align="center">-</td><td align="center">${iData[k]}</td><td align="center" class="status-DU">DƯ</td></tr>`;
            }
        }

        function renderStats() {
            const stats = {}; let totalIn = 0;
            localInputData.forEach(batch => {
                const u = batch.checkerName || "Ẩn";
                if(!stats[u]) stats[u] = {qty:0, count:0};
                stats[u].qty += (batch.totalBatchQty || 0);
                stats[u].count++;
                totalIn += (batch.totalBatchQty || 0);
            });
            
            const totalOut = localMasterData.reduce((s, i) => s + i.expectedQuantity, 0);
            const ul = document.getElementById('stats-list');
            ul.innerHTML = '';
            
            if (Object.keys(stats).length === 0 && localMasterData.length === 0) {
                ul.innerHTML = '<li style="justify-content:center; color:#888; border:none; padding:10px 0;">Chưa có dữ liệu cước gốc và tour nhập nào.</li>';
                return;
            }

            Object.keys(stats).sort((a,b)=>stats[b].qty - stats[a].qty).forEach(u => {
                ul.innerHTML += `<li><span>👤 ${u}</span><span>Đã nhập: <b>${stats[u].qty}</b> (${stats[u].count} tour)</span></li>`;
            });
            const diff = totalIn - totalOut;
            const clr = diff === 0 ? 'green' : (diff > 0 ? '#fd7e14' : '#dc3545');
            const txt = diff > 0 ? `(Dư ${diff})` : (diff < 0 ? `(Thiếu ${Math.abs(diff)})` : '(Khớp)');
            ul.innerHTML += `<li class="total-row"><span>TỔNG CƯỚC GỐC: ${totalOut}</span><span style="color:${clr}">ĐÃ NHẬP: ${totalIn}</span></li><li style="justify-content:center;border:none;color:${clr}">${txt}</li>`;
        }

        // --- 7. QUẢN LÝ: UPLOAD EXCEL ---
        window.handleFileUpload = async () => {
            const fileInput = document.getElementById('excel-file');
            const file = fileInput.files[0];
            const status = document.getElementById('upload-status');
            
            if(!file) return alert("⚠️ Vui lòng chọn file!");
            status.innerHTML = '⏳ Đang đọc file Excel...';
            addLog('info', `Bắt đầu đọc file Excel: "${file.name}" (${Math.round(file.size / 1024)} KB)`);
            
            const r = new FileReader();
            r.onload = async(e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, {type:'array'});
                    const sheet = wb.Sheets[wb.SheetNames[0]];
                    
                    // Lấy thông tin từ ô C3 và C4
                    const infoC3 = sheet['C3'] ? String(sheet['C3'].v).trim() : "Trống";
                    const infoC4 = sheet['C4'] ? String(sheet['C4'].v).trim() : "Trống";

                    const rows = XLSX.utils.sheet_to_json(sheet, {header: "A", defval: ""});
                    const cleanData = [];
                    rows.forEach(row => {
                        const receiver = String(row['C']).trim();
                        const qty = Number(row['D']);
                        // Bắt đầu lấy từ sau các dòng thông tin (ví dụ từ dòng 5 trở đi)
                        if(receiver && receiver !== "NGƯỜI NHẬN" && !isNaN(qty) && qty > 0) {
                            cleanData.push({ receiver: receiver.toUpperCase(), expectedQuantity: qty });
                        }
                    });

                    addLog('info', `Đã phân tích Excel: ${cleanData.length} dòng hợp lệ (C3: "${infoC3}", C4: "${infoC4}"). Đang lưu lên Firebase...`);

                    // Lưu cả dữ liệu khách và thông tin header lên Firebase
                    await set(ref(db, REF_MASTER), {
                        info3: infoC3,
                        info4: infoC4,
                        details: cleanData,
                        uploadedAt: Date.now()
                    });
                    
                    addLog('success', `Đã lưu thành công Master Data lên CSDL mới (${cleanData.length} dòng).`);
                    status.innerHTML = `<b style="color:green;">✅ Đã xong (${cleanData.length} dòng)</b>`;
                } catch (err) {
                    addLog('error', 'Lỗi khi xử lý hoặc upload file Excel: ' + err.message, err);
                    status.innerHTML = `<span style="color:red;">❌ Lỗi: ${err.message}</span>`;
                }
            };
            r.onerror = (err) => {
                addLog('error', 'Lỗi đọc file từ thiết bị: ' + err.message, err);
                status.innerHTML = '<span style="color:red;">❌ Lỗi đọc file từ thiết bị</span>';
            };
            r.readAsArrayBuffer(file);
        };

        // --- 8. QUẢN LÝ: RESET (CHỌN TỪNG TOUR) ---

        // --- 9. CHỐT CƯỚC & LỊCH SỬ KẾT QUẢ ---
        window.saveResultHistory = async () => {
            const headerC4 = document.getElementById('display-c4').innerText;
            if (!headerC4 || headerC4 === "-") {
                return alert("⚠️ Không tìm thấy tiêu đề (ô C4). Vui lòng upload Excel trước!");
            }

            const confirmSave = await window.showCustomModal(
                "📌 Chốt dữ liệu", 
                `Ngày: ${headerC4}?`, 
                true
            );

            if (!confirmSave) return;

            const checkers = [...new Set(localInputData.map(b => b.checkerName))];
            
            const mData = {};
            localMasterData.forEach(i => {
                const k = i.receiver.toUpperCase().trim();
                if(!mData[k]) mData[k] = {name: i.receiver, exp:0};
                mData[k].exp += i.expectedQuantity;
            });
            
            const iData = {};
            localInputData.forEach(batch => {
                if(batch.items) {
                    batch.items.forEach(item => {
                        const k = item.receiver.toUpperCase().trim();
                        if(!iData[k]) iData[k] = 0;
                        iData[k] += item.quantity;
                    });
                }
            });

            const finalSnap = [];
            for(let k in mData) {
                finalSnap.push({ name: mData[k].name, exp: mData[k].exp, act: iData[k] || 0 });
            }
            for(let k in iData) {
                if(!mData[k]) finalSnap.push({ name: k + " (Lạ)", exp: 0, act: iData[k] });
            }

            const now = Date.now();
            const payload = {
                title: headerC4,
                checkers: checkers,
                timestamp: now,
                dateStr: new Date(now).toLocaleString(),
                details: finalSnap
            };

            try {
                const safeBase = headerC4.replace(/[.#$[\]]/g, "_");
                const safeKey = `${safeBase}_${now}`;
                addLog('info', `Đang lưu chốt cước: "${headerC4}" (${finalSnap.length} dòng)...`);
                await set(ref(db, `${REF_RESULT_HISTORY}/${safeKey}`), payload);
                addLog('success', `Đã lưu chốt cước thành công vào: ${safeKey}`);
                await window.showCustomModal("Thành công");
            } catch (e) {
                addLog('error', 'Lỗi khi lưu chốt cước: ' + e.message, e);
                await window.showCustomModal("Lỗi", "Lỗi khi lưu: " + e.message);
            }

        function sanitizeId(key) {

        window.openResultHistoryModal = () => {
            addLog('info', 'Đang tải danh sách lịch sử chốt cước...');
            onValue(ref(db, REF_RESULT_HISTORY), (snapshot) => {
                const data = snapshot.val();
                const listDiv = document.getElementById('result-history-list');
                listDiv.innerHTML = '';

                if (!data) {
                    addLog('info', 'Lịch sử chốt cước đang trống.');
                    listDiv.innerHTML = '<p style="text-align:center; color:#999;">Chưa có dữ liệu lịch sử.</p>';
                } else {
                    const sortedKeys = Object.keys(data).sort((a,b)=>{
                        const ta = data[a].timestamp || 0;
                        const tb = data[b].timestamp || 0;
                        return tb - ta;
                    });
                    addLog('info', `Đã tải ${sortedKeys.length} bản ghi lịch sử chốt cước.`);

                    sortedKeys.forEach(key => {
                        const record = data[key];
                        const checkerList = record.checkers ? record.checkers.join(", ") : "Không rõ";
                        const dateStr = record.dateStr || (record.timestamp ? new Date(record.timestamp).toLocaleString() : 'Không rõ');
                        const detailId = sanitizeId(key);

                        let tableRows = '';
                        (record.details || []).forEach(row => {
                            const status = row.act === row.exp ? 'Khớp' : (row.act > row.exp ? 'Dư' : 'Thiếu');
                            const color = row.act === row.exp ? '#28a745' : (row.act > row.exp ? '#fd7e14' : '#dc3545');
                            tableRows += `
                                <tr>
                                    <td>${row.name}</td>
                                    <td align="center">${row.exp}</td>
                                    <td align="center">${row.act}</td>
                                    <td align="center" style="color:${color}">${status}</td>
                                </tr>`;
                        });

                        listDiv.innerHTML += `
                            <div class="box" style="border-left: 5px solid #6f42c1; margin-bottom: 10px; padding: 10px;">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap:10px;">
                                    <div style="flex:1; min-width:0">
                                        <strong style="font-size: 16px; color: #333; display:block;">📅 ${record.title}</strong>
                                        <div style="font-size: 13px; color: #666; margin-top: 5px;">${dateStr}<br>👤 Người nhập: <span style="color: #007bff;">${checkerList}</span></div>
                                    </div>
                                    <div style="display:flex; gap:8px; align-items:flex-start">
                                        <button onclick="toggleHistoryDetail('${key}')" style="background:#17a2b8; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:12px;">Xem chi tiết</button>
                                        <button onclick="deleteHistoryRecord('${key}')" style="background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:12px;">Xóa</button>
                                    </div>
                                </div>

                                <div id="${detailId}" class="hidden" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; overflow-x: auto;">
                                    <table style="width:100%; font-size:13px;">
                                        <thead style="background:#f8f9fa;"><tr><th>Tên Khách</th><th>Gốc</th><th>Nhập</th><th>KQ</th></tr></thead>
                                        <tbody>${tableRows}</tbody>
                                    </table>
                                </div>
                            </div>`;
                    });
                }
            }, (error) => {
                addLog('error', 'Lỗi tải lịch sử chốt cước: ' + error.message, error);
            }, { onlyOnce: true });

            document.getElementById('result-history-modal').classList.remove('hidden');
        };

        window.toggleHistoryDetail = (key) => {
            const id = sanitizeId(key);
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.toggle('hidden');
        };

        window.deleteHistoryRecord = async (key) => {
            const confirmDelete = await window.showCustomModal(
                "⚠️ Xác nhận xóa", 
                "Bạn có chắc muốn xóa vĩnh viễn dữ liệu đợt này không?", 
                true
            );
            
            if (!confirmDelete) return;
            try {
                addLog('info', `Đang xóa bản ghi chốt cước [${key}]...`);
                await remove(ref(db, `${REF_RESULT_HISTORY}/${key}`));
                addLog('success', `Đã xóa bản ghi chốt cước [${key}].`);
                await window.showCustomModal("Thành công", "Đã xóa dữ liệu chốt.");
                window.openResultHistoryModal();
            } catch (e) {
                addLog('error', 'Lỗi khi xóa lịch sử chốt: ' + e.message, e);
                await window.showCustomModal("Lỗi", 'Lỗi khi xóa: ' + e.message);
            }
        };

        // Hàm hiển thị Popup thay thế cho alert và confirm
        window.showCustomModal = (title, message, isConfirm = false) => {
            return new Promise((resolve) => {
                const modal = document.getElementById('alert-modal');
                const titleEl = document.getElementById('alert-title');
                const msgEl = document.getElementById('alert-message');
                const okBtn = document.getElementById('alert-ok-btn');
                const cancelBtn = document.getElementById('alert-cancel-btn');

                titleEl.innerText = title;
                msgEl.innerText = message || "";
                
                cancelBtn.style.display = isConfirm ? 'block' : 'none';
                modal.classList.remove('hidden');

                okBtn.onclick = () => {
                    modal.classList.add('hidden');
                    resolve(true);
                };

                cancelBtn.onclick = () => {
                    modal.classList.add('hidden');
                    resolve(false);
                };
            });
        };

        window.handleChamCong = () => {
            alert("Tính năng Chấm công đang được phát triển!");
        };

        // Expose Functions to window
        window.nextRow = nextRow;
        window.submitData = submitData;
        window.deleteRow = deleteRow;
        window.handleFileUpload = handleFileUpload;
        window.resetUserData = resetUserData;
        window.triggerResetAll = triggerResetAll;
        window.handlePasswordSubmit = handlePasswordSubmit;
        window.openResetMenu = openResetMenu;
        window.showBatchesToReset = showBatchesToReset;
        window.deleteSpecificBatch = deleteSpecificBatch;
        window.openHistoryModal = openHistoryModal;
        window.openSearchModal = openSearchModal;
        window.managerSearch = managerSearch;
        window.checkManagerLogin = checkManagerLogin;
        window.addLog = addLog;
    </script>
</body>
</html>
