    <style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CẤU HÌNH CỦA BẠN
       const firebaseConfig = {
    apiKey: "AIzaSyCF16Ze3NczHi3B3NU2-y4QJzdx35dKpsY",
    authDomain: "chamcong-1cbc1.firebaseapp.com",
    databaseURL: "https://chamcong-1cbc1-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "chamcong-1cbc1",
    storageBucket: "chamcong-1cbc1.firebasestorage.app",
    messagingSenderId: "1037808997570",
    appId: "1:1037808997570:web:0c3bd96af91a30edc9975b",
    measurementId: "G-LR48BVDHY3"
};


        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const REF_MASTER = "master_data";
        const REF_INPUT = "input_data";
        const MANAGER_PASS = "2308";

        let currentUser = "";
        let pendingData = [];
        let localMasterData = [];
        let localInputData = [];
        
        // Biến trạng thái: Popup Password đang dùng để làm gì?
        // 'LOGIN': Đăng nhập quản lý
        // 'RESET': Xóa sạch dữ liệu
        let passwordAction = 'LOGIN'; 

        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        
        // --- 1. XỬ LÝ MẬT KHẨU CHUNG ---
        window.checkManagerLogin = () => {
            passwordAction = 'LOGIN';
            document.getElementById('password-title').innerText = "🔒 Đăng nhập ";
            document.getElementById('manager-password').value = '';
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('manager-password').focus();
        };

        window.triggerResetAll = () => {
            passwordAction = 'RESET';
            document.getElementById('password-title').innerText = "⚠️ Xác nhận Xóa dữ liệu";
            document.getElementById('manager-password').value = '';
            document.getElementById('password-modal').classList.remove('hidden');
            document.getElementById('manager-password').focus();
        };

        // Hàm xử lý khi bấm nút "Xác nhận" trên popup password
        window.handlePasswordSubmit = () => {
            const pass = document.getElementById('manager-password').value;
            
            if (pass !== MANAGER_PASS) {
                alert("❌ Mật khẩu không đúng!");
                return;
            }

            // Nếu mật khẩu đúng, kiểm tra xem đang làm hành động gì
            window.closeModal('password-modal');
            
            if (passwordAction === 'LOGIN') {
                // Thực hiện đăng nhập
                currentUser = "Tí Đô";
                document.getElementById('current-user-display').innerText = "Tí Đô";
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('input-screen').classList.remove('hidden');
                document.getElementById('manager-area').classList.remove('hidden');

                document.getElementById('btn-save-history').classList.remove('hidden');
                document.getElementById('btn-view-history').classList.remove('hidden');
            } 
            else if (passwordAction === 'RESET') {
                // Thực hiện xóa dữ liệu
                doResetAllData();
            }
        };

        // --- 2. CÁC HÀM ĐIỀU HƯỚNG ---
        window.selectUser = (name) => {
            currentUser = name;
            document.getElementById('current-user-display').innerText = name;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('input-screen').classList.remove('hidden');
            document.getElementById('manager-area').classList.add('hidden');
            document.getElementById('btn-save-history').classList.add('hidden');
            document.getElementById('btn-view-history').classList.add('hidden');
            document.getElementById('inp-name').focus();
            
        };

        window.viewResultMode = () => {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('input-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            renderTable();
        };

        window.backToInput = () => {
            document.getElementById('result-screen').classList.add('hidden');
            if(currentUser) document.getElementById('input-screen').classList.remove('hidden');
            else document.getElementById('login-screen').classList.remove('hidden');
        };

        // --- 3. INPUT (BATCH) ---
        window.nextRow = () => {
            const name = document.getElementById('inp-name').value.trim().toUpperCase();
            const qty = document.getElementById('inp-qty').value;
            if(!name || !qty) return alert("Thiếu thông tin!");
            
            pendingData.push({ receiver: name, quantity: parseInt(qty) });
            renderReview();
            document.getElementById('inp-name').value = '';
            document.getElementById('inp-qty').value = '';
            document.getElementById('inp-name').focus();
        };

        window.submitData = async () => {
            if(pendingData.length === 0) return alert("tour trống!");
            const btn = document.querySelector('.btn-submit');
            btn.innerText = "Đang gửi..."; btn.disabled = true;

            try {
                const totalQty = pendingData.reduce((sum, item) => sum + item.quantity, 0);
                const batchPayload = {
                    checkerName: currentUser,
                    timestamp: Date.now(),
                    items: pendingData,
                    totalBatchQty: totalQty
                };

                const newRef = push(ref(db, REF_INPUT));
                await set(newRef, batchPayload);

                pendingData = [];
                renderReview();
                viewResultMode(); 
            } catch(e) {
                alert("Lỗi: " + e.message);
            } finally {
                btn.innerText = "GỬI DỮ LIỆU"; btn.disabled = false;
            }
        };

        function renderReview() {
            const area = document.getElementById('review-area');
            document.getElementById('pending-count').innerText = pendingData.length;
            area.innerHTML = '';
            pendingData.forEach((item, idx) => {
                area.innerHTML += `
                    <div class="review-item">
                        <div style="flex:1">${item.receiver} - <b style="color:#007bff">${item.quantity}</b></div>
                        <div><button class="btn-mini btn-del" onclick="deleteRow(${idx})">✕</button></div>
                    </div>`;
            });
            area.scrollTop = area.scrollHeight;
        }
        window.deleteRow = (i) => { pendingData.splice(i, 1); renderReview(); };

        // --- 4. LỊCH SỬ ---
        window.openHistoryModal = () => {
            const listDiv = document.getElementById('history-list');
            listDiv.innerHTML = '';
            
            let myBatches = localInputData.filter(d => d.checkerName === currentUser);
            let sortedAsc = [...myBatches].sort((a,b) => a.timestamp - b.timestamp);
            let batchIndexMap = new Map();
            sortedAsc.forEach((batch, idx) => batchIndexMap.set(batch.id, idx + 1));
            
            let sortedDesc = [...sortedAsc].reverse();

            if(sortedDesc.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#999">Chưa có tour nhập.</p>';
            } else {
                sortedDesc.forEach(batch => {
                    const idx = batchIndexMap.get(batch.id);
                    let itemsHtml = '';
                    if (batch.items) {
                        batch.items.forEach(item => {
                            itemsHtml += `<div class="batch-row"><span>${item.receiver}</span><b>${item.quantity} thùng</b></div>`;
                        });
                    }
                    listDiv.innerHTML += `
                        <div class="history-batch">
                            <div class="batch-header">
                                <span>tour ${idx}</span>
                                <span>Tổng: ${batch.totalBatchQty} thùng</span>
                            </div>
                            <div class="batch-body">${itemsHtml}</div>
                        </div>`;
                });
            }
            document.getElementById('history-modal').classList.remove('hidden');
        };

       onValue(ref(db, REF_MASTER), (snapshot) => {

    if (data) {

        onValue(ref(db, REF_INPUT), (snapshot) => {
            const data = snapshot.val();
            localInputData = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    let item = data[key];
                    item.id = key;
                    localInputData.push(item);
                });
            }
            renderTable();
            renderStats();
        });

        function renderTable() {
            const mData = {};
            localMasterData.forEach(i => {
                const k = i.receiver.toUpperCase().trim();
                if(!mData[k]) mData[k] = {name: i.receiver, exp:0};
                mData[k].exp += i.expectedQuantity;
            });
            const iData = {};
            localInputData.forEach(batch => {
                if(batch.items) {
                    batch.items.forEach(item => {
                        const k = item.receiver.toUpperCase().trim();
                        if(!iData[k]) iData[k] = 0;
                        iData[k] += item.quantity;
                    });
                }
            });
            const tbody = document.getElementById('comparison-body');
            tbody.innerHTML = '';
            for(let k in mData) {
                const act = iData[k] || 0;
                const exp = mData[k].exp;
                let st = 'OK', cls = 'status-OK';
                if(act > exp) { st = 'DƯ'; cls = 'status-DU'; }
                if(act < exp) { st = 'THIẾU'; cls = 'status-THIEU'; }
                tbody.innerHTML += `<tr><td>${mData[k].name}</td><td align="center">${exp}</td><td align="center">${act}</td><td align="center" class="${cls}">${st}</td></tr>`;
            }
            for(let k in iData) {
                if(!mData[k]) tbody.innerHTML += `<tr class="row-stranger"><td>${k} (Lạ)</td><td align="center">-</td><td align="center">${iData[k]}</td><td align="center" class="status-DU">DƯ</td></tr>`;
            }
        }

        function renderStats() {
            const stats = {}; let totalIn = 0;
            localInputData.forEach(batch => {
                const u = batch.checkerName || "Ẩn";
                if(!stats[u]) stats[u] = {qty:0, count:0};
                stats[u].qty += (batch.totalBatchQty || 0);
                stats[u].count++;
                totalIn += (batch.totalBatchQty || 0);
            });
            
            const totalOut = localMasterData.reduce((s, i) => s + i.expectedQuantity, 0);
            const ul = document.getElementById('stats-list');
            ul.innerHTML = '';
            
            Object.keys(stats).sort((a,b)=>stats[b].qty - stats[a].qty).forEach(u => {
                ul.innerHTML += `<li><span>👤 ${u}</span><span>Đã nhập: <b>${stats[u].qty}</b> (${stats[u].count} tour)</span></li>`;
            });
            const diff = totalIn - totalOut;
            const clr = diff === 0 ? 'green' : (diff > 0 ? '#fd7e14' : '#dc3545');
            const txt = diff > 0 ? `(Dư ${diff})` : (diff < 0 ? `(Thiếu ${Math.abs(diff)})` : '(Khớp)');
            ul.innerHTML += `<li class="total-row"><span>TỔNG CƯỚC GỐC: ${totalOut}</span><span style="color:${clr}">ĐÃ NHẬP: ${totalIn}</span></li><li style="justify-content:center;border:none;color:${clr}">${txt}</li>`;
        }

       window.handleFileUpload = async () => {
    const fileInput = document.getElementById('excel-file');
    const file = fileInput.files[0];
    const status = document.getElementById('upload-status');
    
    if(!file) return alert("⚠️ Vui lòng chọn file!");
    status.innerHTML = '⏳ Đang đọc...';
    
    const r = new FileReader();
    r.onload = async(e) => {
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type:'array'});
            const sheet = wb.Sheets[wb.SheetNames[0]];
            
            // Lấy thông tin từ ô C3 và C4
            const infoC3 = sheet['C3'] ? sheet['C3'].v : "Trống";
            const infoC4 = sheet['C4'] ? sheet['C4'].v : "Trống";

            const rows = XLSX.utils.sheet_to_json(sheet, {header: "A", defval: ""});
            const cleanData = [];
            rows.forEach(row => {
                const receiver = String(row['C']).trim();
                const qty = Number(row['D']);
                // Bắt đầu lấy từ sau các dòng thông tin (ví dụ từ dòng 5 trở đi)
                if(receiver && receiver !== "NGƯỜI NHẬN" && !isNaN(qty) && qty > 0) {
                    cleanData.push({ receiver: receiver.toUpperCase(), expectedQuantity: qty });
                }
            });

            // Lưu cả dữ liệu khách và thông tin header lên Firebase
            await set(ref(db, REF_MASTER), {
                info3: infoC3,
                info4: infoC4,
                details: cleanData
            });
            
            status.innerHTML = '<b style="color:green;">✅ Đã xong</b>';
        } catch (err) {
            status.innerHTML = '<span style="color:red;">❌ Lỗi đọc file</span>';
        }
    };
    r.readAsArrayBuffer(file);
}

const REF_RESULT_HISTORY = "result_history";

    // 1. Hàm lưu kết quả: Lấy Header C4 và danh sách người nhập
    window.saveResultHistory = async () => {
        const headerC4 = document.getElementById('display-c4').innerText;
        if (!headerC4 || headerC4 === "-") {
            return alert("⚠️ Không tìm thấy tiêu đề (ô C4). Vui lòng upload Excel trước!");
        }

       const confirmSave = await window.showCustomModal(
    "📌 Chốt dữ liệu", 
    `Ngày: ${headerC4}?`, 
    true // Hiện nút Hủy (isConfirm = true)
);

if (!confirmSave) return;

        // Lấy danh sách người đã nhập liệu
        const checkers = [...new Set(localInputData.map(b => b.checkerName))];
        
        // Tính toán bảng so sánh (Gốc vs Nhập)
        const mData = {};
        localMasterData.forEach(i => {
            const k = i.receiver.toUpperCase().trim();
            if(!mData[k]) mData[k] = {name: i.receiver, exp:0};
            mData[k].exp += i.expectedQuantity;
        });
        
        const iData = {};
        localInputData.forEach(batch => {
            if(batch.items) {
                batch.items.forEach(item => {
                    const k = item.receiver.toUpperCase().trim();
                    if(!iData[k]) iData[k] = 0;
                    iData[k] += item.quantity;
                });
            }
        });

        const finalSnap = [];
        for(let k in mData) {
            finalSnap.push({ name: mData[k].name, exp: mData[k].exp, act: iData[k] || 0 });
        }
        for(let k in iData) {
            if(!mData[k]) finalSnap.push({ name: k + " (Lạ)", exp: 0, act: iData[k] });
        }

        const now = Date.now();
        const payload = {
            title: headerC4, // Sử dụng dữ liệu ô C4
            checkers: checkers, // Danh sách tên người nhập
            timestamp: now,
            dateStr: new Date(now).toLocaleString(),
            details: finalSnap
        };

        try {
            // Tạo khóa an toàn và duy nhất: tiêu đề đã sanitize + timestamp
            const safeBase = headerC4.replace(/[.#$[\]]/g, "_");
            const safeKey = `${safeBase}_${now}`;
            await set(ref(db, `${REF_RESULT_HISTORY}/${safeKey}`), payload);
            await window.showCustomModal("Thành công");
        } catch (e) {
            await window.showCustomModal("Lỗi", "Lỗi khi lưu: " + e.message);
        }
    };

    // Utility: sanitize key for DOM id
    function sanitizeId(key) {
        return `detail_${String(key).replace(/[^a-zA-Z0-9_-]/g, '_')}`;
    }

    // 2. Hàm mở lịch sử: Hiển thị dạng danh sách chọn (tổng quát, 1 listener mỗi lần mở)
    window.openResultHistoryModal = () => {
        onValue(ref(db, REF_RESULT_HISTORY), (snapshot) => {
            const data = snapshot.val();
            const listDiv = document.getElementById('result-history-list');
            listDiv.innerHTML = '';

            if (!data) {
                listDiv.innerHTML = '<p style="text-align:center; color:#999;">Chưa có dữ liệu lịch sử.</p>';
            } else {
                // Sắp xếp mới nhất lên đầu (keys chứa timestamp suffix)
                const sortedKeys = Object.keys(data).sort((a,b)=>{
                    const ta = data[a].timestamp || 0;
                    const tb = data[b].timestamp || 0;
                    return tb - ta;
                });

                sortedKeys.forEach(key => {
                    const record = data[key];
                    const checkerList = record.checkers ? record.checkers.join(", ") : "Không rõ";
                    const dateStr = record.dateStr || (record.timestamp ? new Date(record.timestamp).toLocaleString() : 'Không rõ');
                    const detailId = sanitizeId(key);

                    // Build table rows safely
                    let tableRows = '';
                    (record.details || []).forEach(row => {
                        const status = row.act === row.exp ? 'Khớp' : (row.act > row.exp ? 'Dư' : 'Thiếu');
                        const color = row.act === row.exp ? '#28a745' : (row.act > row.exp ? '#fd7e14' : '#dc3545');
                        tableRows += `
                            <tr>
                                <td>${row.name}</td>
                                <td align="center">${row.exp}</td>
                                <td align="center">${row.act}</td>
                                <td align="center" style="color:${color}">${status}</td>
                            </tr>`;
                    });

                    listDiv.innerHTML += `
                        <div class="box" style="border-left: 5px solid #6f42c1; margin-bottom: 10px; padding: 10px;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap:10px;">
                                <div style="flex:1; min-width:0">
                                    <strong style="font-size: 16px; color: #333; display:block;">📅 ${record.title}</strong>
                                    <div style="font-size: 13px; color: #666; margin-top: 5px;">${dateStr}<br>👤 Người nhập: <span style="color: #007bff;">${checkerList}</span></div>
                                </div>
                                <div style="display:flex; gap:8px; align-items:flex-start">
                                    <button onclick="toggleHistoryDetail('${key}')" style="background:#17a2b8; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:12px;">Xem chi tiết</button>
                                    <button onclick="deleteHistoryRecord('${key}')" style="background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:12px;">Xóa</button>
                                </div>
                            </div>

                            <div id="${detailId}" class="hidden" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; overflow-x: auto;">
                                <table style="width:100%; font-size:13px;">
                                    <thead style="background:#f8f9fa;"><tr><th>Tên Khách</th><th>Gốc</th><th>Nhập</th><th>KQ</th></tr></thead>
                                    <tbody>${tableRows}</tbody>
                                </table>
                            </div>
                        </div>`;
                });
            }
        }, { onlyOnce: true });

        document.getElementById('result-history-modal').classList.remove('hidden');
    };

    // Hàm bổ trợ: Ẩn hiện chi tiết (dùng sanitizeId để tìm element)
    window.toggleHistoryDetail = (key) => {
        const id = sanitizeId(key);
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.toggle('hidden');
    };

    // Hàm xóa một bản ghi lịch sử (chung, duy nhất)
    window.deleteHistoryRecord = async (key) => {
        const confirmDelete = await window.showCustomModal(
        "⚠️ Xác nhận xóa", 
        "Bạn có chắc muốn xóa vĩnh viễn dữ liệu đợt này không?", 
        true
    );
    
    if (!confirmDelete) return;
        try {
            await remove(ref(db, `${REF_RESULT_HISTORY}/${key}`));
            await window.showCustomModal("Thành công", "Đã xóa dữ liệu chốt.");
            // Refresh modal content
            window.openResultHistoryModal();
        } catch (e) {
            await window.showCustomModal("Lỗi", 'Lỗi khi xóa: ' + e.message);
        }
    };


// Hàm hiển thị Popup thay thế cho alert và confirm
window.showCustomModal = (title, message, isConfirm = false) => {
    return new Promise((resolve) => {
        const modal = document.getElementById('alert-modal');
        const titleEl = document.getElementById('alert-title');
        const msgEl = document.getElementById('alert-message');
        const okBtn = document.getElementById('alert-ok-btn');
        const cancelBtn = document.getElementById('alert-cancel-btn');

        titleEl.innerText = title;
        msgEl.innerText = message;
        
        // Nếu là alert (không phải confirm) thì ẩn nút Hủy
        cancelBtn.style.display = isConfirm ? 'block' : 'none';
        
        modal.classList.remove('hidden');

        okBtn.onclick = () => {
            modal.classList.add('hidden');
            resolve(true);
        };

        cancelBtn.onclick = () => {
            modal.classList.add('hidden');
            resolve(false);
        };
    });
};
