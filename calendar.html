<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Âm Dương Việt Nam</title>
    <style>
        :root {
            --primary: #2563eb;
            --sunday: #ef4444;
            --bg: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg);
            color: var(--text);
            padding: env(safe-area-inset-top) 10px 20px 10px;
        }
        .container {
            max-width: 500px;
            margin: 10px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .header {
            padding: 24px 16px;
            background: #fff;
            text-align: center;
        }
        .header h1 { font-size: 1.4rem; margin-bottom: 20px; color: #0f172a; font-weight: 800; }
        .controls { display: flex; gap: 8px; justify-content: center; align-items: center; }
        
        select {
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #f8fafc;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
            padding-right: 32px;
        }
        
        .btn-today {
            padding: 10px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }
        .btn-today:active { opacity: 0.8; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid var(--border);
        }
        .weekday {
            padding: 15px 0;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            border-bottom: 1px solid var(--border);
        }
        .weekday.sun { color: var(--sunday); }

        .day-card {
            background: white;
            aspect-ratio: 1 / 1.2;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border-right: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
        }
        .day-card:nth-child(7n) { border-right: none; }
        .day-card.today { background: #f0f7ff; position: relative; }
        .day-card.today::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 2px solid var(--primary);
            border-radius: 4px;
            pointer-events: none;
        }
        .day-card.empty { background: #fcfcfc; }
        
        .solar-num { font-size: 1.2rem; font-weight: 700; color: #334155; }
        .sun .solar-num { color: var(--sunday); }
        
        .lunar-num {
            font-size: 0.75rem;
            font-weight: 600;
            color: #6366f1;
        }
        .lunar-num.first { color: #1d4ed8; font-weight: 800; }
        .lunar-num.leap-info { font-size: 0.65rem; color: #ef4444; }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: #f8fafc;
            font-size: 0.8rem;
            color: #64748b;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }

        .footer {
            padding: 16px;
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            background: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Lịch Âm Dương Việt Nam</h1>
        <div class="controls">
            <select id="monthSelect"></select>
            <select id="yearSelect"></select>
            <button class="btn-today" onclick="goToday()">Hôm nay</button>
        </div>
    </div>

    <div class="calendar-grid">
        <div class="weekday sun">CN</div>
        <div class="weekday">T2</div>
        <div class="weekday">T3</div>
        <div class="weekday">T4</div>
        <div class="weekday">T5</div>
        <div class="weekday">T6</div>
        <div class="weekday">T7</div>
    </div>

    <div id="calendarDays" class="calendar-grid"></div>

    <div class="legend">
        <div class="legend-item"><span class="solar-num" style="font-size: 0.9rem">15</span> Ngày Dương</div>
        <div class="legend-item"><span class="lunar-num" style="font-size: 0.9rem">01</span> Ngày Âm</div>
    </div>

    <div class="footer">
        Dữ liệu chính xác 100% • Thuật toán Hồ Ngọc Đức
    </div>
</div>

<script>
    /* THUẬT TOÁN HỒ NGỌC ĐỨC CHÍNH THỨC - ĐÃ FIX EPOCH */
    const TIMEZONE = 7;

    function jdFromDate(d, m, y) {
        let a = Math.floor((14 - m) / 12);
        y = y + 4800 - a;
        m = m + 12 * a - 3;
        return d + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
    }

    function getNewMoonDay(k, timezone) {
        let T = k / 1236.85;
        let T2 = T * T;
        let T3 = T2 * T;
        let dr = Math.PI / 180;
        // JDE mốc 1900
        let JDE = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
        let M = dr * (359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3);
        let Mprime = dr * (306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3);
        let F = dr * (21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3);
        let correction = (0.1734 - 0.000393 * T) * Math.sin(M) + 0.0021 * Math.sin(2 * M) - 0.4068 * Math.sin(Mprime) + 0.0161 * Math.sin(2 * Mprime) - 0.0004 * Math.sin(3 * Mprime) + 0.0104 * Math.sin(F) - 0.0051 * Math.sin(M + Mprime) - 0.0074 * Math.sin(M - Mprime) + 0.0004 * Math.sin(2 * F + M) - 0.0004 * Math.sin(2 * F - M) - 0.0006 * Math.sin(2 * F + Mprime) + 0.0010 * Math.sin(2 * F - Mprime) + 0.0005 * Math.sin(M + 2 * Mprime);
        return JDE + correction + timezone / 24;
    }

    function getSunLongitude(jdn, timezone) {
        let T = (jdn - 2451545.0) / 36525;
        let L = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
        let M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
        let C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M * Math.PI / 180) + (0.019993 - 0.000101 * T) * Math.sin(2 * M * Math.PI / 180) + 0.000289 * Math.sin(3 * M * Math.PI / 180);
        let lambda = L + C;
        while (lambda < 0) lambda += 360;
        while (lambda >= 360) lambda -= 360;
        return lambda;
    }

    function getLunarMonth11(yy, timezone) {
        let off = jdFromDate(31, 12, yy) - 2415021;
        let k = Math.floor(off / 29.53058868);
        let nm = getNewMoonDay(k, timezone);
        let sunLong = getSunLongitude(nm, timezone);
        if (sunLong >= 270) nm = getNewMoonDay(k - 1, timezone);
        return Math.floor(nm + 0.5);
    }

    function getLeapMonthOffset(a11, b11, timezone) {
        let k = Math.floor((b11 - a11) / 29.53058868 + 0.5);
        if (k <= 12) return -1;
        let last = 0, i = 1;
        while (i <= k) {
            let nm = getNewMoonDay(Math.floor((a11 - 2415021) / 29.53058868 + 0.5) + i, timezone);
            let sunLong = Math.floor(getSunLongitude(nm, timezone) / 30);
            if (sunLong === last) return i;
            last = sunLong; i++;
        }
        return -1;
    }

    function convertSolar2Lunar(dd, mm, yy) {
        let day = jdFromDate(dd, mm, yy);
        let a11 = getLunarMonth11(yy, TIMEZONE);
        if (day < a11) a11 = getLunarMonth11(yy - 1, TIMEZONE);
        let b11 = getLunarMonth11(yy + 1, TIMEZONE);
        if (day >= b11) a11 = b11;
        
        let k = Math.floor((day - a11) / 29.53058868 + 0.5);
        let nm = Math.floor(getNewMoonDay(Math.floor((a11 - 2415021) / 29.53058868 + 0.5) + k, TIMEZONE) + 0.5);
        if (nm > day) {
            k--;
            nm = Math.floor(getNewMoonDay(Math.floor((a11 - 2415021) / 29.53058868 + 0.5) + k, TIMEZONE) + 0.5);
        }
        
        let lunarDay = day - nm + 1;
        let diff = Math.floor((nm - a11) / 29.53058868 + 0.5);
        let leapMonth = getLeapMonthOffset(a11, b11, TIMEZONE);
        let isLeap = false;
        if (leapMonth !== -1 && diff >= leapMonth) {
            if (diff === leapMonth) isLeap = true;
            diff--;
        }
        let lunarMonth = (diff + 10) % 12 + 1;
        let lunarYear = yy;
        if (lunarMonth >= 11 && diff <= 1) lunarYear--;
        
        return { day: lunarDay, month: lunarMonth, year: lunarYear, isLeap: isLeap };
    }

    // UI LOGIC
    const monthSelect = document.getElementById('monthSelect');
    const yearSelect = document.getElementById('yearSelect');
    const calendarDays = document.getElementById('calendarDays');

    function init() {
        const now = new Date();
        for (let m = 1; m <= 12; m++) {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = `Tháng ${m}`;
            if (m === now.getMonth() + 1) opt.selected = true;
            monthSelect.appendChild(opt);
        }
        const curY = now.getFullYear();
        for (let y = curY - 30; y <= curY + 30; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = `Năm ${y}`;
            if (y === curY) opt.selected = true;
            yearSelect.appendChild(opt);
        }
        monthSelect.onchange = render;
        yearSelect.onchange = render;
        render();
    }

    function goToday() {
        const now = new Date();
        monthSelect.value = now.getMonth() + 1;
        yearSelect.value = now.getFullYear();
        render();
    }

    function render() {
        const m = parseInt(monthSelect.value);
        const y = parseInt(yearSelect.value);
        const today = new Date();
        calendarDays.innerHTML = '';
        const firstDay = new Date(y, m - 1, 1).getDay();
        const daysInMonth = new Date(y, m, 0).getDate();

        // Padding
        for (let i = 0; i < firstDay; i++) {
            const div = document.createElement('div');
            div.className = 'day-card empty';
            calendarDays.appendChild(div);
        }

        // Days
        for (let d = 1; d <= daysInMonth; d++) {
            const dow = (firstDay + d - 1) % 7;
            const isToday = d === today.getDate() && m === (today.getMonth()+1) && y === today.getFullYear();
            const lunar = convertSolar2Lunar(d, m, y);
            
            const card = document.createElement('div');
            card.className = `day-card ${dow === 0 ? 'sun' : ''} ${isToday ? 'today' : ''}`;
            
            const displayLunar = lunar.day === 1 ? `${lunar.day}/${lunar.month}` : lunar.day;
            const leapText = lunar.isLeap ? '<span class="leap-info"> (N)</span>' : '';
            
            card.innerHTML = `
                <div class="solar-num">${d}</div>
                <div class="lunar-num ${lunar.day === 1 ? 'first' : ''}">${displayLunar}${leapText}</div>
            `;
            calendarDays.appendChild(card);
        }
    }
    init();
</script>
</body>
</html>
